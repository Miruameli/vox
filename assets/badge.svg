<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 44" width="292" height="44" role="img" aria-label="GitHub Miruameli">
  <!--
    Vox brand badge: GitHub | Miruameli pill.
    Oxblood and gold on ivory per the Vox palette.
  -->
  <defs>
    <linearGradient id="badge-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C565"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <rect rx="8" width="292" height="44" fill="#4A1525"/>
  <rect x="104" width="2" height="44" fill="#C9A227" opacity="0.5"/>
  <text x="18" y="28" font-family="Georgia, 'DejaVu Serif', serif" font-size="16"
        letter-spacing="1" fill="#F5EFE0">GitHub</text>
  <text x="118" y="28" font-family="Georgia, 'DejaVu Serif', serif" font-size="16"
        letter-spacing="1" fill="url(#badge-gold)">Miruameli</text>
</svg>
