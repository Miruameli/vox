<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Vox — terminal coding agent">
  <!--
    Vox logo lockup.
    Brand: oxblood plaque #4A1525, gold #C9A227 / #E3C565, ivory #F5EFE0,
    serif wordmark (Georgia with DejaVu Serif fallback).
    Medallion: serif V monogram over a five-bar voice waveform (vox = voice).
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C565"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- Plaque -->
  <rect x="4" y="4" width="632" height="192" rx="18" fill="#4A1525"/>
  <rect x="12" y="12" width="616" height="176" rx="12" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="18" y="18" width="604" height="164" rx="8" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.55"/>

  <!-- Medallion -->
  <circle cx="112" cy="100" r="62" fill="#3d1020" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="112" cy="100" r="52" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.6"/>

  <!-- Voice waveform: five bars -->
  <g fill="url(#gold)">
    <rect x="82"  y="86" width="7" height="28" rx="3.5"/>
    <rect x="95"  y="74" width="7" height="52" rx="3.5"/>
    <rect x="108" y="64" width="7" height="72" rx="3.5"/>
    <rect x="121" y="74" width="7" height="52" rx="3.5"/>
    <rect x="134" y="86" width="7" height="28" rx="3.5"/>
  </g>

  <!-- Wordmark -->
  <text x="206" y="112" font-family="Georgia, 'DejaVu Serif', serif" font-size="76"
        font-weight="bold" letter-spacing="14" fill="url(#gold)">VOX</text>
  <line x1="210" y1="128" x2="596" y2="128" stroke="#C9A227" stroke-width="1" opacity="0.6"/>
  <text x="212" y="156" font-family="Georgia, 'DejaVu Serif', serif" font-size="21"
        letter-spacing="7" fill="#F5EFE0">TERMINAL CODING AGENT</text>
</svg>
